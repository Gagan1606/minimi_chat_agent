<link rel="stylesheet" href="./admin.css" />

<section class="company-admin" aria-labelledby="company-admin-title">
  <h1 id="company-admin-title">Company administration</h1>
  <p>
    Manage this company’s workspaces and member access. Transcript content and
    detailed security events are not available here.
  </p>
  <form id="workspace-create">
    <label>Workspace name <input name="name" maxlength="160" required /></label
    ><button>Create workspace</button>
  </form>
  <form id="member-add">
    <label>Person ID <input name="personId" required /></label
    ><label>Workspace ID <input name="workspaceId" required /></label
    ><button>Add member</button>
  </form>
  <form id="workspace-admin-assign">
    <label>Workspace ID <input name="workspaceId" required /></label
    ><label
      >New Workspace Admin person ID <input name="personId" required /></label
    ><button>Assign Workspace Admin</button>
  </form>

  <form id="company-admin-assign">
    <label>New Company Admin person ID <input name="personId" required /></label
    ><button>Assign Company Admin</button>
  </form>
  <p role="status" aria-live="polite" id="company-admin-status"></p>
</section>
<script type="module">
  const companyId = new URLSearchParams(location.search).get("companyId");
  const status = document.querySelector("#company-admin-status");
  const send = async (path, method, body) => {
    const response = await fetch(path, {
      method,
      credentials: "same-origin",
      headers: {
        "content-type": "application/json",
        "x-csrf-token":
          document.querySelector('meta[name="csrf-token"]')?.content ?? "",
        ...(method === "POST"
          ? { "idempotency-key": crypto.randomUUID() }
          : {}),
      },
      body: JSON.stringify(body),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message ?? "Request failed");
    return data;
  };
  document
    .querySelector("#workspace-create")
    .addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const name = new FormData(event.currentTarget).get("name");
        const result = await send(
          `/api/v1/companies/${companyId}/workspaces`,
          "POST",
          { name },
        );
        status.textContent = `Workspace created: ${result.id}`;
      } catch (error) {
        status.textContent = error.message;
      }
    });
  document
    .querySelector("#member-add")
    .addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const data = Object.fromEntries(new FormData(event.currentTarget));
        await send(`/api/v1/companies/${companyId}/members`, "POST", data);
        status.textContent = "Member added.";
      } catch (error) {
        status.textContent = error.message;
      }
    });
  document
    .querySelector("#workspace-admin-assign")
    .addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const data = Object.fromEntries(new FormData(event.currentTarget));
        const workspaceId = data.workspaceId;
        delete data.workspaceId;
        await send(
          `/api/v1/workspaces/${workspaceId}/workspace-admin`,
          "PUT",
          data,
        );
        status.textContent = "Workspace Admin assigned.";
      } catch (error) {
        status.textContent = error.message;
      }
    });
  document
    .querySelector("#company-admin-assign")
    .addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const personId = new FormData(event.currentTarget).get("personId");
        await send(`/api/v1/companies/${companyId}/company-admin`, "PUT", {
          personId,
        });
        status.textContent = "Company Admin assigned.";
      } catch (error) {
        status.textContent = error.message;
      }
    });
</script>
