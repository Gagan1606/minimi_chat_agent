services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DATABASE:-momos}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-momos}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-momos}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - momos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-dev-only-change-me}
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/local/keycloak/momos-demo-realm.json:/opt/keycloak/data/import/momos-demo-realm.json:ro

volumes:
  momos-postgres-data:
